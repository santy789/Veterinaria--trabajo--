<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Historial clínico - Veterinaria Huellas</title><link rel="stylesheet" href="../css/styles.css"></head>
<body><header><h1>Historial clínico</h1><p>Información de las mascotas y sus consultas</p></header><nav><a href="../index.html">Inicio</a><a href="solicitar-turno.html">Solicitar turno</a><a href="mis-turnos.html">Mis turnos</a><a href="historial-clinico.html">Historial clínico</a></nav>
<main><section class="panel"><label for="dueno">Cliente</label><select id="dueno"><option value="3">Santiago di Virgilio</option><option value="4">Francisco Gonzalez</option></select><div id="historial"></div></section></main><footer>Veterinaria Huellas</footer>
<script>
(async()=>{if(!localStorage.getItem('datosVet')){const r=await fetch('../data/datos.json');localStorage.setItem('datosVet',JSON.stringify(await r.json()));}const datos=JSON.parse(localStorage.getItem('datosVet'));const select=document.getElementById('dueno'),out=document.getElementById('historial');function render(){out.innerHTML='';datos.mascotas.filter(m=>m.duenoId===Number(select.value)).forEach(m=>{const sec=document.createElement('article');sec.innerHTML='<h3>'+m.nombre+'</h3><p><b>Especie:</b> '+m.especie+' · <b>Raza:</b> '+m.raza+' · <b>Edad:</b> '+m.edad+' años</p>';const ts=datos.turnos.filter(t=>t.mascotaId===m.id);if(ts.length){const ul=document.createElement('ul');ts.forEach(t=>{const li=document.createElement('li');li.textContent=t.fecha+' '+t.hora+' — '+t.motivo+' ('+t.estado+')';ul.appendChild(li)});sec.appendChild(ul)}else{sec.insertAdjacentHTML('beforeend','<p>Sin consultas registradas.</p>')}out.appendChild(sec)})}select.addEventListener('change',render);render();})().catch(e=>console.error(e));
</script></body></html>
