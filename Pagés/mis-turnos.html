<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mis turnos - Veterinaria Huellas</title><link rel="stylesheet" href="../css/styles.css"></head>
<body><header><h1>Mis turnos</h1><p>Consultá los turnos registrados</p></header><nav><a href="../index.html">Inicio</a><a href="solicitar-turno.html">Solicitar turno</a><a href="mis-turnos.html">Mis turnos</a><a href="historial-clinico.html">Historial clínico</a></nav>
<main><section class="panel"><label for="dueno">Ver turnos de</label><select id="dueno"><option value="3">Santiago di Virgilio</option><option value="4">Francisco Gonzalez</option></select><div id="lista"></div></section></main><footer>Veterinaria Huellas</footer>
<script>
(async()=>{if(!localStorage.getItem('datosVet')){const r=await fetch('../data/datos.json');localStorage.setItem('datosVet',JSON.stringify(await r.json()));}const datos=JSON.parse(localStorage.getItem('datosVet'));const select=document.getElementById('dueno'),lista=document.getElementById('lista');function render(){lista.innerHTML='';const ids=datos.mascotas.filter(m=>m.duenoId===Number(select.value)).map(m=>m.id);const turnos=datos.turnos.filter(t=>ids.includes(t.mascotaId));if(!turnos.length){lista.textContent='No hay turnos registrados.';return;}turnos.forEach(t=>{const m=datos.mascotas.find(x=>x.id===t.mascotaId);const v=datos.usuarios.find(x=>x.id===t.veterinarioId);const div=document.createElement('article');div.className='tarjeta-turno';div.innerHTML='<h3>Turno #'+t.id+'</h3><p><b>Mascota:</b> '+m.nombre+'</p><p><b>Veterinario:</b> '+v.nombre+'</p><p><b>Fecha:</b> '+t.fecha+' - '+t.hora+'</p><p><b>Motivo:</b> '+t.motivo+'</p><p><b>Estado:</b> '+t.estado+'</p>';lista.appendChild(div);});}select.addEventListener('change',render);render();})().catch(e=>console.error(e));
</script></body></html>
